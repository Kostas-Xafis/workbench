# The desktop app's Rust (src-tauri/): cargo check, clippy (warnings fail) and cargo test. Runs only when the app
# changes; the TypeScript it bundles is server.yml, and its release builds are release.yml (on a version tag).
name: Desktop app

on:
  push:
    branches: [master]
    paths:
      - "src-tauri/**"
      - ".github/workflows/app.yml"
  pull_request:
    branches: [master]
    paths:
      - "src-tauri/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    name: Desktop app (cargo check, clippy, test)
    # A release commit only changes the version numbers of what the commit before it was checked with, and its tag
    # builds everything anyway (release.yml).
    if: ${{ !startsWith(github.event.head_commit.message, 'Release ') }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries for Tauri (WebKitGTK 4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri-build copies the sidecar next to the app's binary and fails without it; cargo check doesn't run it.
      - name: Placeholder sidecar
        run: mkdir -p binaries && touch "binaries/workbench-server-$(rustc --print host-tuple)"
      - run: cargo check --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
