[package]
name = "workbench-app"
version = "0.1.0"
description = "Workbench desktop app: a Tauri shell around the Bun board server"
edition = "2021"
publish = false

[lib]
name = "workbench_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP to the board on 127.0.0.1 only (server.rs ping, tray.rs count): no TLS, no JSON feature needed.
ureq = { version = "3", default-features = false }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# notify.rs: D-Bus signals through GIO and raising the window with an activation token. The debug-only probe
# (src/probe.rs) uses them too: synthetic clicks on the webview.
gtk = "0.18"
webkit2gtk = "2.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
